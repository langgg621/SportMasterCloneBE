services:
  api:
    build: .
    container_name: sportmaster_api
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Bắt buộc phải dùng host.docker.internal để kết nối với MySQL đang chạy trên máy thật của bạn
      - DB_HOST=host.docker.internal 
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped